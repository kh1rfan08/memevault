<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>memevault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">meme<span class="accent">vault</span></div>
      <div class="header-right">
        <div class="drop-badge" id="drop-badge"></div>
        <button class="vault-btn" id="stats-btn" title="Stats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>
          </svg>
        </button>
        <button class="vault-btn" id="vault-btn" title="History Vault">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>loading drop...</p>
    </div>

    <div id="card-container">
      <div id="card-stack"></div>
      <div id="counter"></div>
      <div id="vote-bar" class="vote-bar hidden">
        <button class="vote-btn vote-down" id="vote-down" title="Thumbs down" aria-label="Thumbs down">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
          </svg>
        </button>
        <button class="vote-btn vote-up" id="vote-up" title="Thumbs up" aria-label="Thumbs up">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="swipe-hint" class="swipe-hint">
      <span>swipe to browse</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </div>

    <div id="end-screen" class="end-screen hidden">
      <div class="end-icon">&#10003;</div>
      <h2>you're all caught up</h2>
      <p class="end-subtitle">next drop in</p>
      <div class="countdown" id="countdown"></div>
      <p class="end-hint">close the app. go outside. touch grass.</p>
      <button class="end-vault-link" id="end-vault-btn">or browse old dumps</button>
    </div>

    <div id="waiting-screen" class="waiting-screen hidden">
      <div class="waiting-icon">&#9202;</div>
      <h2>no memes yet</h2>
      <p class="end-subtitle">next drop in</p>
      <div class="countdown" id="countdown-waiting"></div>
      <p class="end-hint">patience, young memester.</p>
    </div>

    <!-- History Vault -->
    <div id="vault-screen" class="vault-screen hidden">
      <div class="vault-header">
        <button class="vault-back" id="vault-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2>history vault</h2>
        <div style="width:20px"></div>
      </div>
      <div class="vault-list" id="vault-list"></div>
    </div>

    <!-- History Drop Detail -->
    <div id="vault-detail" class="vault-screen hidden">
      <div class="vault-header">
        <button class="vault-back" id="vault-detail-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2 id="vault-detail-title">drop</h2>
        <button class="swipe-mode-btn" id="swipe-mode-btn" title="Swipe mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>
          </svg>
        </button>
      </div>
      <div class="vault-grid" id="vault-grid"></div>
    </div>

    <!-- Stats Screen -->
    <div id="stats-screen" class="vault-screen hidden">
      <div class="vault-header">
        <button class="vault-back" id="stats-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2>stats</h2>
        <div style="width:20px"></div>
      </div>
      <div class="stats-body" id="stats-body"></div>
    </div>

    <!-- Swipe Mode (replay drop) -->
    <div id="swipe-mode" class="swipe-mode-screen hidden">
      <div class="swipe-mode-header">
        <button class="vault-back" id="swipe-mode-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2 id="swipe-mode-title">swipe mode</h2>
        <div style="width:20px"></div>
      </div>
      <div class="swipe-mode-body">
        <div id="swipe-mode-stack" class="swipe-mode-stack"></div>
        <div id="swipe-mode-counter" class="swipe-mode-counter"></div>
      </div>
      <div id="swipe-mode-end" class="swipe-mode-end hidden">
        <div class="end-icon">&#10003;</div>
        <h2>that's all of them</h2>
        <button class="end-vault-link" id="swipe-mode-done">back to drop</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then((reg) => {
        setInterval(() => reg.update(), 60000);
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>

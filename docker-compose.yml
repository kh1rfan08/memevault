services:
  memevault:
    build: .
    container_name: memevault
    restart: unless-stopped
    environment:
      - PORT=3000
    volumes:
      - memevault-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meme.rule=Host(`meme.oddlayer.tech`)"
      - "traefik.http.routers.meme.entrypoints=websecure"
      - "traefik.http.routers.meme.tls.certresolver=mytlschallenge"
      - "traefik.http.services.meme.loadbalancer.server.port=3000"
    networks:
      - n8n_default

volumes:
  memevault-data:

networks:
  n8n_default:
    external: true
